---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: openmetadataentitytags.openmetadata.vortexa.com
spec:
  group: openmetadata.vortexa.com
  names:
    kind: OpenMetadataEntityTag
    listKind: OpenMetadataEntityTagList
    plural: openmetadataentitytags
    singular: openmetadataentitytag
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.match.entityType
      name: Entity Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenMetadataEntityTag is the Schema for the openmetadataentitytags API.
          It applies a tag to OpenMetadata entities matched by FQN pattern.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OpenMetadataEntityTagSpec defines the desired state of an
              OpenMetadataEntityTag, which applies tags to OpenMetadata entities the
              operator does not create directly (tables, topics, schemas, etc. discovered
              by ingestion).
            properties:
              match:
                description: Match selects the entities this CR applies to.
                properties:
                  entityType:
                    description: |-
                      EntityType is the OpenMetadata entity type to match. Must be one of the
                      supported lower-level types (table, topic, databaseSchema, database, etc.).
                    enum:
                    - table
                    - topic
                    - databaseSchema
                    - database
                    - dashboard
                    - mlmodel
                    - pipeline
                    - container
                    - searchIndex
                    type: string
                  excludes:
                    description: |-
                      Excludes is an optional list of FQN patterns to subtract from the
                      included set. Same pattern syntax as Includes.
                    items:
                      type: string
                    type: array
                  includes:
                    description: |-
                      Includes is the list of FQN patterns whose union defines the matched set.
                      Each pattern uses '*' as a wildcard (zero or more characters) and '?' for
                      a single character, applied to the entity's full FQN. Patterns should
                      typically begin with the service name to scope the match. Examples:
                      "my-svc.raw.*", "my-svc.public.events".
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - entityType
                - includes
                type: object
              openMetadataConnectionRef:
                description: |-
                  OpenMetadataConnectionRef is the name of the cluster-scoped OpenMetadataConnection
                  resource that defines the target OpenMetadata instance.
                minLength: 1
                type: string
              tag:
                description: |-
                  Tag is the tag to apply to every matched entity.
                  To apply more than one tag to the same entity set, use one CR per tag.
                properties:
                  tagFQN:
                    description: |-
                      TagFQN is the fully qualified name of the tag, in the form
                      "<classification>.<tagName>" (e.g. "Tier.Tier3", "PII.Sensitive").
                    minLength: 1
                    type: string
                required:
                - tagFQN
                type: object
            required:
            - match
            - openMetadataConnectionRef
            - tag
            type: object
          status:
            description: OpenMetadataEntityTagStatus defines the observed state of
              an OpenMetadataEntityTag.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              tagAssignments:
                description: |-
                  TagAssignments is the set of (entity, tag) assignments the operator has
                  applied. The operator manages only these assignments additively — tags
                  set via the OM UI or by other controllers are left untouched.
                items:
                  description: |-
                    TagAssignment records a single (entity, tag) assignment the operator has
                    made. Used to detect drift and to drive removal on CR deletion.
                  properties:
                    entityId:
                      description: EntityID is the OpenMetadata UUID of the tagged
                        entity.
                      type: string
                    entityType:
                      description: EntityType of the tagged entity.
                      enum:
                      - table
                      - topic
                      - databaseSchema
                      - database
                      - dashboard
                      - mlmodel
                      - pipeline
                      - container
                      - searchIndex
                      type: string
                    fullyQualifiedName:
                      description: FullyQualifiedName of the tagged entity.
                      type: string
                    tagFQN:
                      description: TagFQN is the fully qualified name of the applied
                        tag.
                      type: string
                  required:
                  - entityId
                  - entityType
                  - fullyQualifiedName
                  - tagFQN
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
