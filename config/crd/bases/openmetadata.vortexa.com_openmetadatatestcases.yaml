---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: openmetadatatestcases.openmetadata.vortexa.com
spec:
  group: openmetadata.vortexa.com
  names:
    kind: OpenMetadataTestCase
    listKind: OpenMetadataTestCaseList
    plural: openmetadatatestcases
    singular: openmetadatatestcase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forOpenMetadata.testDefinition
      name: Test Definition
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenMetadataTestCase is the Schema for the openmetadatatestcases API.
          It declaratively manages a test case in OpenMetadata.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenMetadataTestCaseSpec defines the desired state of an
              OpenMetadataTestCase.
            properties:
              forOpenMetadata:
                description: ForOpenMetadata contains the fields forwarded to the
                  OpenMetadata API.
                properties:
                  computePassedFailedRowCount:
                    description: ComputePassedFailedRowCount controls whether to compute
                      row counts.
                    type: boolean
                  description:
                    description: Description of the test case.
                    type: string
                  displayName:
                    description: DisplayName is a human-readable name shown in the
                      OpenMetadata UI.
                    type: string
                  entityLink:
                    description: |-
                      EntityLink identifies the entity being tested.
                      Format: <#E::table::service.database.schema.table> for table tests
                              <#E::table::service.database.schema.table::columns::colName> for column tests
                    minLength: 1
                    type: string
                  owners:
                    description: |-
                      Owners is the list of users and/or teams that own this test case in OpenMetadata.
                      Each entry references a user or team by fullyQualifiedName; the operator
                      resolves these to UUIDs at reconcile time.
                    items:
                      description: EntityReference identifies an entity in OpenMetadata
                        by FQN and type.
                      properties:
                        fullyQualifiedName:
                          description: FullyQualifiedName of the referenced entity.
                          minLength: 1
                          type: string
                        type:
                          description: Type of the referenced entity (e.g. "databaseService",
                            "testSuite").
                          enum:
                          - databaseService
                          - messagingService
                          - dashboardService
                          - pipelineService
                          - mlmodelService
                          - storageService
                          - searchService
                          - metadataService
                          - apiService
                          - testSuite
                          - user
                          - team
                          type: string
                      required:
                      - fullyQualifiedName
                      - type
                      type: object
                    type: array
                  parameterValues:
                    description: ParameterValues are the test-specific parameters.
                    items:
                      description: TestCaseParameterValue is a name-value pair for
                        test parameters.
                      properties:
                        name:
                          description: Name of the parameter.
                          type: string
                        value:
                          description: Value of the parameter.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  testDefinition:
                    description: TestDefinition is the FQN of the test definition
                      (e.g. "columnValuesToBeNotNull").
                    minLength: 1
                    type: string
                required:
                - entityLink
                - testDefinition
                type: object
              openMetadataConnectionRef:
                description: |-
                  OpenMetadataConnectionRef is the name of the cluster-scoped OpenMetadataConnection
                  resource that defines the target OpenMetadata instance.
                minLength: 1
                type: string
            required:
            - forOpenMetadata
            - openMetadataConnectionRef
            type: object
          status:
            description: OpenMetadataTestCaseStatus defines the observed state of
              an OpenMetadataTestCase.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fullyQualifiedName:
                description: FullyQualifiedName as stored in OpenMetadata.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              openmetadataId:
                description: OpenMetadataID is the UUID assigned by OpenMetadata.
                type: string
              remoteVersion:
                description: RemoteVersion is the entity version last seen in OpenMetadata.
                type: string
              testSuiteId:
                description: TestSuiteID is the UUID of the auto-created basic test
                  suite.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
