---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: openmetadataservices.openmetadata.vortexa.com
spec:
  group: openmetadata.vortexa.com
  names:
    kind: OpenMetadataService
    listKind: OpenMetadataServiceList
    plural: openmetadataservices
    singular: openmetadataservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forOpenMetadata.serviceType
      name: Service Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.openmetadataId
      name: OM ID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenMetadataService is the Schema for the openmetadataservices API.
          It declaratively manages a service registration in OpenMetadata.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenMetadataServiceSpec defines the desired state of an OpenMetadata
              service registration.
            properties:
              forOpenMetadata:
                description: ForOpenMetadata contains the fields forwarded to the
                  OpenMetadata API.
                properties:
                  connection:
                    description: Connection holds the opaque connection configuration
                      forwarded to OpenMetadata.
                    properties:
                      config:
                        description: |-
                          Config is the connection configuration map passed through to the OpenMetadata API
                          after resolving any secret references. Each field must use one of:
                            {"value": <literal>}       -- unwrapped and passed through as-is
                            {"valueFrom": {"secretKeyRef": {"name": "<secret>", "key": "<key>"}}}
                                                       -- resolved from the referenced Kubernetes Secret
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    required:
                    - config
                    type: object
                  description:
                    description: Description is a markdown-formatted description of
                      the service.
                    type: string
                  displayName:
                    description: DisplayName is a human-readable name shown in the
                      OpenMetadata UI.
                    type: string
                  serviceType:
                    description: |-
                      ServiceType is the OpenMetadata service type (e.g. Postgres, Athena, Kafka).
                      The operator derives the correct API endpoint from this value automatically.
                    enum:
                    - Postgres
                    - Athena
                    - BigQuery
                    - BigTable
                    - Mysql
                    - Redshift
                    - Snowflake
                    - Timescale
                    - Mssql
                    - Oracle
                    - Hive
                    - Impala
                    - Presto
                    - Trino
                    - Vertica
                    - Glue
                    - MariaDB
                    - Druid
                    - Db2
                    - Clickhouse
                    - Databricks
                    - AzureSQL
                    - DynamoDB
                    - SingleStore
                    - SQLite
                    - DeltaLake
                    - Salesforce
                    - PinotDB
                    - Datalake
                    - DomoDatabase
                    - QueryLog
                    - CustomDatabase
                    - Dbt
                    - SapHana
                    - MongoDB
                    - Cassandra
                    - Couchbase
                    - Greenplum
                    - Doris
                    - StarRocks
                    - UnityCatalog
                    - SAS
                    - Iceberg
                    - Teradata
                    - SapErp
                    - Synapse
                    - Exasol
                    - Cockroach
                    - SSAS
                    - Epic
                    - ServiceNow
                    - Dremio
                    - MicrosoftFabric
                    - Kafka
                    - Redpanda
                    - Kinesis
                    - CustomMessaging
                    - S3
                    - ADLS
                    - GCS
                    - CustomStorage
                    - ElasticSearch
                    - OpenSearch
                    - CustomSearch
                    type: string
                required:
                - connection
                - serviceType
                type: object
              openMetadataConnectionRef:
                description: |-
                  OpenMetadataConnectionRef is the name of the cluster-scoped OpenMetadataConnection
                  resource that defines the target OpenMetadata instance.
                minLength: 1
                type: string
            required:
            - forOpenMetadata
            - openMetadataConnectionRef
            type: object
          status:
            description: OpenMetadataServiceStatus defines the observed state of an
              OpenMetadata service registration.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fullyQualifiedName:
                description: FullyQualifiedName is the FQN as stored in OpenMetadata.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              openmetadataId:
                description: OpenMetadataID is the UUID assigned by OpenMetadata when
                  the service was created.
                type: string
              remoteVersion:
                description: |-
                  RemoteVersion is the entity version last seen in OpenMetadata,
                  serialised as a string (e.g. "0.1"). Used to detect external drift
                  (e.g. manual changes in the OM UI).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
